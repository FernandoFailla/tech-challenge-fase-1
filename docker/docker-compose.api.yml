services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: churn-api-dev
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Hot-reload do codigo fonte
      - ../src:/app/src
      # Mapeia a pasta de modelos para inferencia
      - ../models:/app/models
    environment:
      - PYTHONPATH=/app
    # Comando de desenvolvimento com hot-reload habilitado no FastAPI
    command: uv run fastapi dev src/api/main.py --host 0.0.0.0 --port 8000
    networks:
      - api-network

networks:
  api-network:
    driver: bridge
