      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "163ea11d014a82296f0a52af447e2376", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"resumo-executivo\"\u003E\ud83d\udcca Resumo Executivo\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EVis\u00e3o geral dos principais insights acion\u00e1veis descobertos durante a An\u00e1lise Explorat\u00f3ria, focados em \u003Cstrong\u003EEstrat\u00e9gia de Neg\u00f3cio\u003C/strong\u003E e \u003Cstrong\u003EModelagem Preditiva\u003C/strong\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "3f3b4e6d36591c32f14dd812f51bc255", "console": [], "id": "MJUe", "outputs": [{"data": {"text/html": "\u003Cmarimo-callout-output data-html='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\u0026lt;strong\u0026gt;\ud83c\udfaf O Desafio do Churn (Vari\u00e1vel Alvo)\u0026lt;/strong\u0026gt;\u0026#92;nA taxa de cancelamento global da base \u00e9 de \u0026lt;strong\u0026gt;~26.5%\u0026lt;/strong\u0026gt;.\u0026#92;nComo a base \u00e9 \u0026lt;strong\u0026gt;desbalanceada\u0026lt;/strong\u0026gt; (73.5% vs 26.5%), nossos modelos de Machine Learning precisar\u00e3o de t\u00e9cnicas de balanceamento (como pesos de classe ou SMOTE) e dever\u00e3o ser avaliados por m\u00e9tricas sens\u00edveis a minorias, como \u0026lt;strong\u0026gt;F1-Score\u0026lt;/strong\u0026gt; ou \u0026lt;strong\u0026gt;ROC-AUC\u0026lt;/strong\u0026gt;, abandonando a acur\u00e1cia simples.\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-kind='\u0026quot;warn\u0026quot;'\u003E\u003C/marimo-callout-output\u003E"}, "type": "data"}]}, {"code_hash": "4443ae7975d6c72c5368f5bdeb48407f", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\ud83d\udcbc Alavancas de Neg\u00f3cio (A\u00e7\u00f5es de Reten\u00e7\u00e3o)\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;,\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\ud83e\udd16 Diretrizes para Modelagem (Feature Engineering)\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;]' data-multiple='false'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EFideliza\u00e7\u00e3o Contratual:\u003C/strong\u003E O contrato mensal (\u003Ccode\u003EMonth-to-month\u003C/code\u003E) tem um churn assustador de \u003Cstrong\u003E42.7%\u003C/strong\u003E. Migrar clientes para contratos de 1 ano derruba a taxa para \u003Cstrong\u003E11.3%\u003C/strong\u003E. Campanhas agressivas de \u003Cem\u003Eupgrade\u003C/em\u003E para planos anuais s\u00e3o a maior alavanca financeira.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFric\u00e7\u00e3o de Pagamento:\u003C/strong\u003E Clientes que pagam por \u003Cem\u003EElectronic check\u003C/em\u003E (45.3% de churn) saem quase 3x mais que os de d\u00e9bito autom\u00e1tico (~16%). Oferecer descontos para o cadastro em cart\u00e3o de cr\u00e9dito/d\u00e9bito autom\u00e1tico reduz o atrito e a inadimpl\u00eancia.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EO Paradoxo da Fibra \u00d3ptica:\u003C/strong\u003E O servi\u00e7o de internet mais caro/r\u00e1pido \u00e9 o que mais perde clientes (41.9% de churn). \u00c9 crucial o neg\u00f3cio investigar se o motivo \u00e9 sensibilidade ao pre\u00e7o (\u003Ccode\u003EMonthlyCharges\u003C/code\u003E alto) ou baixa qualidade/instabilidade t\u00e9cnica da fibra entregue.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ELock-in com Servi\u00e7os Extras:\u003C/strong\u003E Clientes sem \u003Ccode\u003EOnlineSecurity\u003C/code\u003E ou \u003Ccode\u003ETechSupport\u003C/code\u003E t\u00eam churn superior a 40%. Oferecer esses servi\u00e7os de forma \"gratuita\" nos primeiros 3 meses cria uma forte barreira de sa\u00edda t\u00e9cnica e psicol\u00f3gica.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EMulticolinearidade Cr\u00edtica:\u003C/strong\u003E \u003Ccode\u003ETotalCharges\u003C/code\u003E possui correla\u00e7\u00e3o alt\u00edssima com \u003Ccode\u003Etenure\u003C/code\u003E (o valor total \u00e9 apenas tempo \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\times||)\u003C/marimo-tex\u003E mensalidade). Para modelos lineares (Regress\u00e3o Log\u00edstica), \u003Ccode\u003ETotalCharges\u003C/code\u003E deve ser \u003Cstrong\u003Eremovida\u003C/strong\u003E para evitar ru\u00eddo matem\u00e1tico.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERemo\u00e7\u00e3o de Features Irrelevantes:\u003C/strong\u003E A feature \u003Ccode\u003Egender\u003C/code\u003E provou-se estatisticamente in\u00fatil para a decis\u00e3o de churn (Feminino 27.0% vs Masculino 26.2%). Deve ser descartada para n\u00e3o gerar ru\u00eddo no modelo.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFoco no In\u00edcio da Jornada:\u003C/strong\u003E A vari\u00e1vel \u003Ccode\u003Etenure\u003C/code\u003E tem fort\u00edssima correla\u00e7\u00e3o negativa com churn (-0.35). O risco \u00e9 m\u00e1ximo no in\u00edcio do ciclo de vida. O modelo de ML precisar\u00e1 ser extremamente preciso em classificar clientes novos (0 a 6 meses).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ECodifica\u00e7\u00e3o de Vari\u00e1veis:\u003C/strong\u003E Features bin\u00e1rias como \u003Ccode\u003ESeniorCitizen\u003C/code\u003E devem ser tratadas corretamente (e n\u00e3o como vari\u00e1veis cont\u00ednuas num\u00e9ricas) em algoritmos baseados em \u00e1rvores e florestas (Random Forest, XGBoost).\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "a4e734107768ba6d90885b8634b41b34", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EVis\u00e3o Executiva:\u003C/strong\u003E Grupos com taxa de evas\u00e3o superior a 40% (A\u00e7\u00e3o Imediata)\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-mime-renderer data-mime='\u0026quot;application/vnd.marimo+mimebundle\u0026quot;' data-data='\u0026quot;{\u0026#92;\u0026quot;image/png\u0026#92;\u0026quot;: \u0026#92;\u0026quot;data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAk4AAAGGCAYAAACNCg6xAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjksIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvJkbTWQAAAAlwSFlzAAAPYQAAD2EBqD+naQAAgCRJREFUeJzt3XdYFNfXwPHvAksTLAhYUAGNYgEBS4xd0cRuYktsaKyxxIYNJcYuttiwxNhbEmMEYzdqotHYYo++EruIoCiKKHVZ9v1DnZ8rxUXRRTmf59lHdubOnXNmkT3ce3dQ6XQ6HUIIIYQQ4qVMjB2AEEIIIcS7QgonIYQQQggDSeEkhBBCCGEgKZyEEEIIIQwkhZMQQgghhIGkcBJCCCGEMJAUTkIIIYQQBpLCSQghhBDCQFI4CSGEEEIYSAonIYQQ6fL398fNzQ03NzeCgoKMHY7i6NGjSlw+Pj7GDidb+Pr6KjkFBwcbOxyFj4+PEtfRo0eNHU6OYGbsAIQQr8/Hx4dbt24Z3H716tVUq1btDUaUMV9fX44dO5bh/kaNGjFv3ryX9nP06FG6dOmSaRsnJyf++OOPLMcIEBwcrFzThg0bUq5cuVfqR2Quve9dU1NTbG1tKVWqFE2bNqV9+/aYmcnbVXa5du0aP//8M0ePHiU8PJzExEQcHBwoVqwYH3/8Mc2bN8fOzs7YYeZY8p0ohBDpCAkJUQo8JycnKZzeIq1WS0xMDCdOnODEiROcOXOGGTNmKPvLly/PunXrALCwsDBWmO+kRYsWERQUhFar1dseERFBREQEx44dIzU1lS+//NI4Ab4DpHAS4j0wd+5ckpKSlOcbN25UhvsdHByYM2eOXns3N7e3GV6Gnr35Pa9AgQKv1NfcuXOxt7fX2/auvKkmJiZibm6OiUnuXj3RunVr2rRpQ0xMDEuXLuXUqVMAbN68mWHDhlGoUCEAbG1t ec808926f044ff3", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E\ud83d\udcca Insights do Mapa de Risco:\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udd34 Zona Cr\u00edtica (Novo + Premium):\u003C/strong\u003E Clientes com menos de 1 ano pagando mensalidades altas s\u00e3o o grupo de \u003Cstrong\u003Emaior risco absoluto\u003C/strong\u003E da base. Sem fidelidade contratual, saem assim que sentirem que o custo n\u00e3o compensa.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udfe1 Zona de Aten\u00e7\u00e3o (Novo + Padr\u00e3o):\u003C/strong\u003E Mesmo pagando valores m\u00e9dios, a falta de tempo de casa mant\u00e9m o churn elevado. Aqui cabem campanhas de desconto progressivo nos primeiros 6 meses.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udfe2 Zona Segura (Veterano + Qualquer ticket):\u003C/strong\u003E Ap\u00f3s 4 anos, o cliente est\u00e1 \"preso\" \u00e0 operadora. O churn despenca independente do valor pago. O foco deve ser upsell, n\u00e3o reten\u00e7\u00e3o.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udca1 A\u00e7\u00e3o Imediata para Diretoria:\u003C/strong\u003E Priorizar 100% da verba de reten\u00e7\u00e3o nos primeiros 12 meses de vida do cliente. Ap\u00f3s esse per\u00edodo, o ROI de campanhas de reten\u00e7\u00e3o cai drasticamente.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": null, "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "157f3dd2f9622811ff803f61a7efbb51", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"processamento-de-dados\"\u003E\u2699\ufe0f Processamento de Dados\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EImport u00e9 \u00ednfimo e n\u00e3o causa perda significativa de informa\u00e7\u00e3o preditiva (al\u00e9m de representar clientes novos sem fatura gerada), a abordagem mais simples e robusta \u00e9 a \u003Cstrong\u003Eremo\u00e7\u00e3o dessas linhas\u003C/strong\u003E (Drop NA).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ENota: Este tratamento j\u00e1 foi implementado de forma reativa na nossa pipeline de Processamento de Dados (Etapa 5 - Coluna Central), garantindo que as an\u00e1lises visuais abaixo utilizem a base \u003Ccode\u003Edf_eda\u003C/code\u003E 100% limpa.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fb4d709eda6664e8766b6b2912679d73", "console": [], "id": "yOPj", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"33-analise-da-variavel-target-churn\"\u003E3.3 An\u00e1lise da vari\u00e1vel target (\u003Ccode\u003EChurn\u003C/code\u003E)\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7391d0833e30ad10818b75c29631abc6", "console": [], "id": "fwwy", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7ed22bff86cd32f807b67528f9839deb", "console": [], "id": "LJZf", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EAtributo Churn \u00e9 uma string\u003C/strong\u003E, iremos transforma-l\u00e1 em 0,1 para facilitar a an\u00e1lise.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "42a5d86ebbb77814456b97a3f6a62eef", "console": [], "id": "urSm", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7562b42f4c4abf3ceaaff8d3287163f5", "console": [], "id": "jxvo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EVari\u00e1vel Target:\u003C/strong\u003E A vari\u00e1vel alvo \u003Ccode\u003EChurn\u003C/code\u003E est\u00e1 desbalanceada (ratio ~0.36), o que refor\u00e7a a necessidade de avaliar m\u00e9tricas al\u00e9m de acur\u00e1cia.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f5d3373039ce375fe624dc289e3a7a0f", "console": [], "id": "mWxS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"34-analise-das-features-categoricas\"\u003E3.4 An\u00e1lise das features categ\u00f3ricas\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f6bba032a5bc1485f31561bf7646faf9", "console": [], "id": "CcZR", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='CcZR-0' random-id='64bc561d-5dbd-d4e8-b43d-579a711c20a0'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;gender\u0026quot;]' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\ud83c\udfaf Selecione a Feature Categ\u00f3rica:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-options='[\u0026quot;gender\u0026quot;,\u0026quot;SeniorCitizen\u0026quot;,\u0026quot;Partner\u0026quot;,\u0026quot;Dependents\u0026quot;,\u0026quot;PhoneService\u0026quot;,\u0026quot;MultipleLines\u0026quot;,\u0026quot;InternetService\u0026quot;,\u0026quot;OnlineSecurity\u0026quot;,\u0026quot;OnlineBackup\u0026quot;,\u0026quot;DeviceProtection\u0026quot;,\u0026quot;TechSupport\u0026quot;,\u0026quot;StreamingTV\u0026quot;,\u0026quot;StreamingMovies\u0026quot;,\u0026quot;Contract\u0026quot;,\u0026quot;PaperlessBilling\u0026quot;,\u0026quot;PaymentMethod\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "6f16d19517eb6fb582ed376263b1201e", "console": [], "id": "YWSi", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "665722bbae79295a6bcef3e81be85c25", "console": [], "id": "zlud", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EPrincipais Insights das Features Categ\u00f3ricas:\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAo navegar pelo menu interativo acima, podemos extrair conclus\u00f5es essenciais sobre o perfil da nossa base de clientes:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udc65 Demografia \u0026amp; Relacionamento:\u003C/strong\u003E A distribui\u00e7\u00e3o de g\u00eanero e parceiros \u00e9 altamente sim\u00e9trica (~50/50). No entanto, \u003Cstrong\u003E70.2%\u003C/strong\u003E dos clientes n\u00e3o possuem dependentes (\u003Ccode\u003EDependents=No\u003C/code\u003E) e \u003Cstrong\u003E83.8%\u003C/strong\u003E n\u00e3o s\u00e3o da terceira idade (\u003Ccode\u003ESeniorCitizen=No\u003C/code\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83c\udf10 Servi\u00e7os Base:\u003C/strong\u003E Quase todos possuem servi\u00e7o telef\u00f4nico (\u003Ccode\u003EPhoneService=Yes\u003C/code\u003E em 90.3%). No mercado de internet, a \u003Cstrong\u003EFibra \u00d3ptica\u003C/strong\u003E \u00e9 o carro-chefe com 44% de penetra\u00e7\u00e3o, seguida pelo DSL (34.4%). Cerca de 21.6% n\u00e3o possuem internet.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udee1\ufe0f Servi\u00e7os Adicionais (Add-ons):\u003C/strong\u003E A ado\u00e7\u00e3o de servi\u00e7os protetivos como \u003Ccode\u003EOnlineSecurity\u003C/code\u003E e \u003Ccode\u003ETechSupport\u003C/code\u003E \u00e9 baixa (~29%). A grande maioria dos clientes prefere pacotes sem essas seguran\u00e7as extras.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u26a0\ufe0f V\u00ednculo e Risco Contratual (Aten\u00e7\u00e3o):\u003C/strong\u003E A caracter\u00edstica que mais chama aten\u00e7\u00e3o \u00e9 o v\u00ednculo financeiro. \u003Cstrong\u003E55.1%\u003C/strong\u003E dos clientes possuem contratos \u003Ccode\u003EMonth-to-month\u003C/code\u003E (mensais), o que facilita muito a taxa de abandono (Churn). Al\u00e9m disso, o m\u00e9todo de pagamento mais comum \u00e9 o \u003Ccode\u003EElectronic check\u003C/code\u003E (33.6%), sugerindo que o atrito mensal de faturamento \u00e9 alto comparado a m\u00e9todos automatizados.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e146c1cd9d34e1d7e507f6b16a36dc6a", "console": [], "id": "tZnO", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"35-analise-de-outliers\"\u003E3.5 An\u00e1lise de Outliers\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "63479ed995bd8a29ce3138dd99231083", "console": [], "id": "xvXZ", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='xvXZ-0' random-id='2994964b-f235-6228-b4ad-30bd33c0beec'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;tenure\u0026quot;]' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\ud83d\udccf Selecione a Feature Num\u00e9rica (Outliers):\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-options='[\u0026quot;tenure\u0026quot;,\u0026quot;MonthlyCharges\u0026quot;,\u0026quot;TotalCharges\u0026quot;,\u0026quot;rfm_recency\u0026quot;,\u0026quot;rfm_frequency\u0026quot;,\u0026quot;rfm_monetary\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "c868dc46ef497784ea74dcb7ff0fbf61", "console": [], "id": "CLip", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7fff2e7bad55a953fa842178457b2159", "console": [], "id": "YECM", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EOutliers:\u003C/strong\u003E Nenhum outlier cr\u00edtico detectado nas vari\u00e1veis num\u00e9ricas.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a443698f65643729fb80342c81ab5c52", "console": [], "id": "cEAS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"36-analise-de-anomalias-e-duplicados\"\u003E3.6 An\u00e1lise de anomalias e duplicados\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7b59b80044f5ed1cd436069f070890bf", "console": [], "id": "iXej", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "90792753c09e5bbcc0f1f5b2c90a548a", "console": [], "id": "EJmg", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EAnomalias e Consist\u00eancia:\u003C/strong\u003E Nenhuma anomalia de dom\u00ednio detectada.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d41f90e29eda73d9c393bffe0deaeb3a", "console": [], "id": "UmEG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"37-analise-de-distribuicoes\"\u003E3.7 An\u00e1lise de distribui\u00e7\u00f5es\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "83b2b1a821da462dfb9b802d73c94eed", "console": [], "id": "vEBW", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3fea722d190faf2d940721038a896678", "console": [], "id": "kLmu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EDistribui\u00e7\u00f5es:\u003C/strong\u003E \u003Ccode\u003Etenure\u003C/code\u003E apresenta distribui\u00e7\u00e3o \u003Cstrong\u003Ebimodal\u003C/strong\u003E (muitos clientes novos com tenure baixo e clientes fidelizados com tenure alto), refletindo dois perfis distintos de comportamento. \u003Ccode\u003EMonthlyCharges\u003C/code\u003E tem leve assimetria \u00e0 direita. \u003Ccode\u003ETotalCharges\u003C/code\u003E \u00e9 fortemente assim\u00e9trico \u00e0 direita.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "70ba3321215367f5907ee6511ece66f9", "console": [], "id": "IpqN", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"38-analise-de-correlacoes-data-readiness\"\u003E3.8 An\u00e1lise de correla\u00e7\u00f5es (data readiness)\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "da339bbc1acc7c6cf15b984dd404f604", "console": [], "id": "dxZZ", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "16a9187b1090c83fdbf0de06555744a1", "console": [], "id": "dlnW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EInsights da Matriz de Correla\u00e7\u00e3o:\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ERisco e Custos (Correla\u00e7\u00f5es Positivas):\u003C/strong\u003E Os contratos mensais (\u003Ccode\u003EContract_Month-to-month\u003C/code\u003E) despontam isoladamente como o \u003Cstrong\u003Emaior preditor positivo de Churn\u003C/strong\u003E (correla\u00e7\u00e3o de \u003Cstrong\u003E0.40\u003C/strong\u003E). Logo atr\u00e1s, a falta de seguran\u00e7a online e suporte t\u00e9cnico (\u003Ccode\u003EOnlineSecurity_No\u003C/code\u003E com 0.34 e \u003Ccode\u003ETechSupport_No\u003C/code\u003E com 0.33) e internet de fibra \u00f3ptica (0.30) completam o topo do ranking de evas\u00e3o.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFidelidade (Correla\u00e7\u00f5es Negativas):\u003C/strong\u003E Tempo de perman\u00eancia (\u003Ccode\u003Etenure\u003C/code\u003E com -0.35) e \u003Cstrong\u003EContratos de 2 anos\u003C/strong\u003E (\u003Ccode\u003EContract_Two year\u003C/code\u003E com -0.30) s\u00e3o os maiores blindadores contra o churn. Curiosamente, a aus\u00eancia de servi\u00e7o de internet (\u003Ccode\u003ENo internet service\u003C/code\u003E com -0.22) tamb\u00e9m tem forte correla\u00e7\u00e3o negativa, sugerindo que clientes apenas de telefonia s\u00e3o mais est\u00e1veis.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAten\u00e7\u00e3o (Multicolinearidade):\u003C/strong\u003E Como esperado, o \u003Ccode\u003ETotalCharges\u003C/code\u003E tem uma alt\u00edssima correla\u00e7\u00e3o com \u003Ccode\u003Etenure\u003C/code\u003E (o total \u00e9 o tempo vezes a mensalidade). Al\u00e9m disso, a \u003Ccode\u003EInternetService_Fiber optic\u003C/code\u003E tem forte rela\u00e7\u00e3o direta com o aumento da \u003Ccode\u003EMonthlyCharges\u003C/code\u003E. Para a modelagem (especialmente algoritmos lineares), o ideal \u00e9 remover o \u003Ccode\u003ETotalCharges\u003C/code\u003E para n\u00e3o confundir o modelo com informa\u00e7\u00f5es redundantes.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1b5e905160bc353672847449143b3472", "console": [], "id": "TTti", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"39-analise-de-churn-vs-features\"\u003E3.9 An\u00e1lise de Churn vs Features\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "60ed03d24323057b1f5f1e0f854e66ed", "console": [], "id": "RKFZ", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='RKFZ-0' random-id='c5503f30-1b6a-16f9-dc23-cc440a1d848e'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;tenure\u0026quot;]' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\ud83d\udcca Selecione a Vari\u00e1vel Num\u00e9rica (KDE):\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-options='[\u0026quot;tenure\u0026quot;,\u0026quot;MonthlyCharges\u0026quot;,\u0026quot;TotalCharges\u0026quot;,\u0026quot;rfm_recency\u0026quot;,\u0026quot;rfm_frequency\u0026quot;,\u0026quot;rfm_monetary\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "362e93073e511677889828c7f5cba6ac", "console": [], "id": "IaQp", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f9e81730c7dd3733b0e92be34051063a", "console": [], "id": "IWgg", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EVari\u00e1veis Num\u00e9ricas vs Churn (KDE):\u003C/strong\u003E As curvas de densidade mostram claramente como os perfis se separam:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EMenor \u003Ccode\u003Etenure\u003C/code\u003E\u003C/strong\u003E: a curva de churn (vermelho) est\u00e1 concentrada \u00e0 esquerda, pr\u00f3xima de zero. Clientes saem cedo, antes de criar v\u00ednculo.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMaior \u003Ccode\u003EMonthlyCharges\u003C/code\u003E\u003C/strong\u003E: a curva de churn (vermelho) est\u00e1 deslocada para a direita, indicando que quem paga mais tende a cancelar mais.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMenor \u003Ccode\u003ETotalCharges\u003C/code\u003E\u003C/strong\u003E: consequ\u00eancia direta do menor tenure \u2014 a curva de churn acumula valores baixos, pois saem antes de acumular cobran\u00e7a.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "cdc0cd5b8dc93829bfccfbfeee209d7e", "console": [], "id": "fCoF", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='fCoF-0' random-id='61c804bf-27c1-1f72-2846-5f29da0cb4af'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;Contract\u0026quot;]' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\ud83d\udcca Churn por Feature Categ\u00f3rica:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-options='[\u0026quot;gender\u0026quot;,\u0026quot;SeniorCitizen\u0026quot;,\u0026quot;Partner\u0026quot;,\u0026quot;Dependents\u0026quot;,\u0026quot;PhoneService\u0026quot;,\u0026quot;MultipleLines\u0026quot;,\u0026quot;InternetService\u0026quot;,\u0026quot;OnlineSecurity\u0026quot;,\u0026quot;OnlineBackup\u0026quot;,\u0026quot;DeviceProtection\u0026quot;,\u0026quot;TechSupport\u0026quot;,\u0026quot;StreamingTV\u0026quot;,\u0026quot;StreamingMovies\u0026quot;,\u0026quot;Contract\u0026quot;,\u0026quot;PaperlessBilling\u0026quot;,\u0026quot;PaymentMethod\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "db8146c72fbf273d45e70477d55f530f", "console": [], "id": "LkGn", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "41384ee3c55d8c15abc8267679499344", "console": [], "id": "zVRe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EInsights Direcion\u00e1veis: Churn vs. Atributos Categ\u00f3ricos\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EExecutando a an\u00e1lise cruzada para todos os atributos em rela\u00e7\u00e3o ao cancelamento (\u003Ccode\u003EChurn = Yes\u003C/code\u003E), os principais ofensores ficam claros:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\ud83d\udcb8 \u003Cstrong\u003EPagamento e Contrato (Os Maiores Ofensores):\u003C/strong\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EPaymentMethod:\u003C/strong\u003E Clientes que pagam via \u003Cstrong\u003EElectronic check\u003C/strong\u003E possuem a maior taxa de churn absoluta da base (\u003Cstrong\u003E45.3%\u003C/strong\u003E), mais que o dobro de qualquer outro m\u00e9todo (como d\u00e9bito autom\u00e1tico ou cart\u00e3o, que ficam na casa dos 15-16%).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EContract:\u003C/strong\u003E A flexibilidade do \u003Cstrong\u003EMonth-to-month\u003C/strong\u003E custa caro: \u003Cstrong\u003E42.7%\u003C/strong\u003E de churn. Prender o cliente em um contrato de 1 ano despenca isso para 11.3%, e de 2 anos para residuais 2.8%.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\ud83c\udf10 \u003Cstrong\u003EServi\u00e7o de Internet e Add-ons:\u003C/strong\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EInternetService:\u003C/strong\u003E Paradoxalmente, o servi\u00e7o mais r\u00e1pido (\u003Cstrong\u003EFiber optic\u003C/strong\u003E) tem o churn mais alto (\u003Cstrong\u003E41.9%\u003C/strong\u003E), enquanto o DSL ret\u00e9m muito mais (19.0%). Clientes que s\u00f3 assinam telefone praticamente n\u00e3o cancelam (7.4%).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EProte\u00e7\u00e3o e Suporte:\u003C/strong\u003E N\u00e3o possuir servi\u00e7os extras de seguran\u00e7a \u00e9 um gatilho. Quem tem \u003Ccode\u003EOnlineSecurity=No\u003C/code\u003E (41.8%) ou \u003Ccode\u003ETechSupport=No\u003C/code\u003E (41.6%) cancela massivamente, ao passo que a ado\u00e7\u00e3o desses servi\u00e7os baixa a evas\u00e3o para a casa dos 14-15%.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67\u200d\ud83d\udc66 \u003Cstrong\u003EPerfil Demogr\u00e1fico:\u003C/strong\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ESeniorCitizen:\u003C/strong\u003E Idosos cancelam numa propor\u00e7\u00e3o bem maior (\u003Cstrong\u003E41.7%\u003C/strong\u003E) que os mais jovens (23.7%).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFam\u00edlia:\u003C/strong\u003E Clientes solteiros (\u003Ccode\u003EPartner=No\u003C/code\u003E: 33.0%) e sem dependentes (31.3%) evadem mais. Planos familiares parecem \"engessar\" a sa\u00edda.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EG\u00eanero:\u003C/strong\u003E Irrelevante para o modelo (Feminino 27.0% vs Masculino 26.2%).\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2a63e6d9bf528262b83f9b9bbbc99159", "console": [], "id": "woaO", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"310-segmentacao-rfm-implicita-analise-por-tempo-de-vida\"\u003E3.10 Segmenta\u00e7\u00e3o RFM Impl\u00edcita (An\u00e1lise por Tempo de Vida)\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EDividindo os clientes em grupos baseados no tempo de perman\u00eancia (\u003Ccode\u003Etenure\u003C/code\u003E), conseguimos enxergar claramente o perfil de risco de cada ciclo de vida.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f6dd7fd682852d7cf276e207b9849831", "console": [], "id": "HnMC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "a505f4112e81f713309fd61b536290dc", "console": [], "id": "wadT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EInsights da Segmenta\u00e7\u00e3o RFM (Recency, Frequency, Monetary):\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA an\u00e1lise RFM segmenta os clientes em 3 dimens\u00f5es cr\u00edticas para reten\u00e7\u00e3o:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u23f0 Recency (Tempo de Vida - \u003Ccode\u003Etenure\u003C/code\u003E):\u003C/strong\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ENovo (0-12m):\u003C/strong\u003E \u00c9 o segmento mais cr\u00edtico. O risco de churn \u00e9 massivo nos primeiros meses. Campanhas de onboarding e primeiros 90 dias s\u00e3o essenciais.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFiel (13-24m):\u003C/strong\u003E Clientes que passaram do primeiro ano demonstram maior resili\u00eancia. A taxa de churn despenca drasticamente. Foco em upsell (venda de add-ons).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPremium (25-48m):\u003C/strong\u003E Clientes consolidados com alta reten\u00e7\u00e3o. Candidatos ideais para programas de fidelidade e contratos de longo prazo (2 anos).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EVeterano (49m+):\u003C/strong\u003E O grupo mais fiel da base. Risco quase zero, mas devem ser mantidos engajados para evitar churn por satura\u00e7\u00e3o.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udcb0 Monetary (Ticket M\u00e9dio - \u003Ccode\u003EMonthlyCharges\u003C/code\u003E):\u003C/strong\u003E\u003Cul\u003E\n\u003Cli\u003EClientes do segmento \u003Cstrong\u003EPremium\u003C/strong\u003E (mensalidade alta) tendem a ser mais sens\u00edveis ao pre\u00e7o, especialmente se usam Fibra \u00d3ptica. O risco de churn est\u00e1 diretamente correlacionado com o valor pago quando n\u00e3o h\u00e1 contrato de fidelidade.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udce1 Frequency (Servi\u00e7os Contratados):\u003C/strong\u003E\u003Cul\u003E\n\u003Cli\u003EClientes com mais servi\u00e7os adicionais (\u003Ccode\u003EOnlineSecurity\u003C/code\u003E, \u003Ccode\u003ETechSupport\u003C/code\u003E, etc.) criam maior \"lock-in\" t\u00e9cnico e psicol\u00f3gico. O gr\u00e1fico de an\u00e1lise de servi\u00e7os mostra que quem tem 0-1 servi\u00e7os extras tem churn muito superior a quem tem 3+ servi\u00e7os.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EPara Modelagem:\u003C/strong\u003E As features \u003Ccode\u003Etenure_segment\u003C/code\u003E, \u003Ccode\u003Emonetary_segment\u003C/code\u003E e \u003Ccode\u003Eservice_segment\u003C/code\u003E s\u00e3o vari\u00e1veis categ\u00f3ricas ordinais extremamente poderosas para os algoritmos de ML, capturando de forma clara o est\u00e1gio do ciclo de vida, poder aquisitivo e engajamento do cliente.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f21211354eea6e11cfbda7b664cdc898", "console": [], "id": "VCRE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"311-analise-avancada-rfm-recency-frequency-monetary\"\u003E3.11 An\u00e1lise Avan\u00e7ada RFM (Recency \u00d7 Frequency \u00d7 Monetary)\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EAgora que temos os 3 segmentos RFM criados, vamos cruz\u00e1-los para identificar os micro-perfis de maior risco.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "94f77a08e02b8c833f74f882e19310c4", "console": [], "id": "hgqU", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='hgqU-0' random-id='cd78a7e4-56f7-6d2c-b09b-d9a80de800a0'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;monetary_segment\u0026quot;]' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;\ud83d\udcb0 Selecione o Segmento RFM:\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-options='[\u0026quot;tenure_segment\u0026quot;,\u0026quot;monetary_segment\u0026quot;,\u0026quot;service_segment\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "d1fa5ea8918de76f1905b49faaa67456", "console": [], "id": "PSUk", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "2197332763af3af39cf726a44690b986", "console": [], "id": "mfOT", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='mfOT-0' random-id='dfe3a7d4-0114-d9fc-7e92-10c6b4f9b4bc'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;tenure_segment\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Novo (0-12m)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Econ\u0026#92;\u0026#92;u00f4mico\u0026#92;\u0026quot;:31.17709437963945,\u0026#92;\u0026quot;Padr\u0026#92;\u0026#92;u00e3o\u0026#92;\u0026quot;:54.3757292882147,\u0026#92;\u0026quot;Premium\u0026#92;\u0026quot;:73.86666666666667},{\u0026#92;\u0026quot;tenure_segment\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Fiel (13-24m)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Econ\u0026#92;\u0026#92;u00f4mico\u0026#92;\u0026quot;:10.526315789473683,\u0026#92;\u0026quot;Padr\u0026#92;\u0026#92;u00e3o\u0026#92;\u0026quot;:28.455284552845526,\u0026#92;\u0026quot;Premium\u0026#92;\u0026quot;:51.36054421768708},{\u0026#92;\u0026quot;tenure_segment\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Premium (25-48m)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Econ\u0026#92;\u0026#92;u00f4mico\u0026#92;\u0026quot;:5.487804878048781,\u0026#92;\u0026quot;Padr\u0026#92;\u0026#92;u00e3o\u0026#92;\u0026quot;:18.007662835249043,\u0026#92;\u0026quot;Premium\u0026#92;\u0026quot;:35.172413793103445},{\u0026#92;\u0026quot;tenure_segment\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Veterano (49m+)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Econ\u0026#92;\u0026#92;u00f4mico\u0026#92;\u0026quot;:2.5500910746812386,\u0026#92;\u0026quot;Padr\u0026#92;\u0026#92;u00e3o\u0026#92;\u0026quot;:5.527638190954774,\u0026#92;\u0026quot;Premium\u0026#92;\u0026quot;:15.187557182067705}]\u0026quot;' data-total-rows='4' data-total-columns='3' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-field-types='[[\u0026quot;Econ\u00f4mico\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;Padr\u00e3o\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;Premium\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[[\u0026quot;tenure_segment\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;category\u0026quot;]]]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "00314cdeaa0a475a673140d1cec34bb1", "console": [], "id": "vGiW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EInsights Avan\u00e7ados da Segmenta\u00e7\u00e3o RFM:\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udcb0 Monetary (Ticket M\u00e9dio):\u003C/strong\u003E Clientes do segmento \u003Cstrong\u003EPremium\u003C/strong\u003E (maiores mensalidades) combinados com contratos mensais representam o maior risco financeiro. A alta mensalidade sem fideliza\u00e7\u00e3o \u00e9 uma receita para churn.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83d\udce1 Frequency (Servi\u00e7os):\u003C/strong\u003E Clientes do segmento \u003Cstrong\u003EB\u00e1sico\u003C/strong\u003E (0 servi\u00e7os extras) t\u00eam churn massivo (~45%), enquanto o segmento \u003Cstrong\u003EFull\u003C/strong\u003E (5-7 servi\u00e7os) ret\u00e9m muito melhor (~15%). Isso prova que cada servi\u00e7o adicional contratado cria uma \"barreira de sa\u00edda\" psicol\u00f3gica e t\u00e9cnica.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u23f0 \u00d7 \ud83d\udcb0 Cruzamento (Heatmap):\u003C/strong\u003E O mapa de calor acima revela que a combina\u00e7\u00e3o mais perigosa \u00e9 \u003Cstrong\u003ENovo (0-12m) + Premium (alto ticket)\u003C/strong\u003E. Esses clientes chegam pagando caro, n\u00e3o t\u00eam fidelidade ainda, e saem rapidamente se sentirem que o custo-benef\u00edcio n\u00e3o bate. A\u00e7\u00f5es: onboarding premium com gerente dedicado nos primeiros 90 dias.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\ud83c\udfaf A\u00e7\u00e3o de Reten\u00e7\u00e3o Imediata:\u003C/strong\u003E O modelo de ML deve priorizar a classifica\u00e7\u00e3o do segmento \u003Cstrong\u003ENovo + Econ\u00f4mico/B\u00e1sico\u003C/strong\u003E, pois s\u00e3o os mais numerosos e vol\u00e1teis. Oferecer desconto progressivo nos primeiros 6 meses pode segurar essa base.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ef2a845166bf27e69d776c1cadeb5ed6", "console": [], "id": "SYQT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"4-funcoes-auxiliares\"\u003E4. \ud83d\udee0\ufe0f Fun\u00e7\u00f5es Auxiliares\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EFun\u00e7\u00f5es para abstrair c\u00f3digo de visualiza\u00e7\u00e3o e utilit\u00e1rios da base.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f97a28d4882b6040a6da209975d00893", "console": [], "id": "bMrW", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "11dd5c6d237e4b8f1a311c256410f50c", "console": [], "id": "PSQn", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e1029febafa34b3ba6af8bb53dc5a35e", "console": [], "id": "OfTS", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8de89d889fa7d1e5c2e4338c811e031e", "console": [], "id": "lQxp", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e2721e373decc009237f38a8183e026d", "console": [], "id": "Plbk", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e29bb8db8d379942547a11c5a994812b", "console": [], "id": "rSYo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": null, "console": [], "id": "HuZB", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.3", "script_metadata_hash": null}, "version": "1"},
